# PostgreSQL 16 with the pgvector extension (needed later for RAG).
# Start:  docker compose up -d      Stop:  docker compose down
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: slotsaver
      POSTGRES_PASSWORD: slotsaver
      POSTGRES_DB: slotsaver
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
